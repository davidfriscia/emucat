# Example only: the external HTTPS reverse proxy in front of EmuCat (MARS shown). It is configured
# separately from this repository; adapt certificates, addresses and names to the real proxy.
#
# Everything goes to the EmuCat web container, which serves the app and forwards /api/ (REST and the
# agent WebSocket) to the API itself. The API port is never exposed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream emucat_test {
    # EMUCAT_BIND_ADDRESS:EMUCAT_HTTP_PORT on the EmuCat host.
    server 10.0.0.2:8095;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name emucat-test.dfri.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name emucat-test.dfri.info;

    ssl_certificate /etc/letsencrypt/live/emucat-test.dfri.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emucat-test.dfri.info/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Agents upload screenshots of up to MEDIA_MAX_UPLOAD_BYTES (64 MiB by default).
    client_max_body_size 80m;

    location / {
        proxy_pass http://emucat_test;
        proxy_http_version 1.1;
        # The API checks Origin against PUBLIC_ORIGIN; keep the browser's Host as well.
        proxy_set_header Host $host;
        # Overwrite, never append, what the client sent: this proxy is the first trusted hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # The agent WebSocket (/api/v1/agent/ws). Agents stay connected for hours and heartbeat every 30 s.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_request_buffering off;
    }
}
