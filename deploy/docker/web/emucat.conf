# Same-origin deployment: the single-page app at /, the API (REST and the agent WebSocket) under /api/.
# The external HTTPS reverse proxy sends everything here; this container is the only way in to the API,
# whose own port is never published.

# The client address. Forwarded headers are believed only from the proxies listed in
# EMUCAT_TRUSTED_PROXIES (see 40-emucat-real-ip.sh); from anyone else they are ignored.
include /run/emucat-web/real-ip.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

# The external proxy terminates TLS and says so. Anything else is treated as plain HTTP.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

upstream emucat_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Screenshot uploads from agents. Keep at least MEDIA_MAX_UPLOAD_BYTES (64 MiB by default).
    client_max_body_size 80m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://emucat_api;
        proxy_http_version 1.1;
        # Exactly what the browser sent, port included: the API compares it with the Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replaces, never appends: the API trusts this container only, and this container has already
        # decided, above, which address the client really has.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Agents keep one WebSocket open for hours and heartbeat every 30 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Vite's hashed bundles never change, so they can be cached for good.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The application shell. Revalidated on every load so that an update reaches browsers at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # History fallback: /vms/qemu/Win98 and other client-side routes load the app shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri /index.html;
    }
}
