name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      # Throwaway credential for the ephemeral service container below.
      MARIADB_ROOT_PASSWORD: ci-only-not-a-secret
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-only-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - name: Lint
        run: pnpm exec eslint . && pnpm exec prettier --check .
      - name: Type check
        run: pnpm -r check
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - if: runner.os == 'Linux'
        # native-tls needs the OpenSSL headers. See decision 0009.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        # The SFTP provider against a real OpenSSH server, and the ZIP64 test. Needs Docker.
        run: cargo test --locked --test sftp --test packaging -- --include-ignored --test-threads=4
      - run: cargo build --release --locked
      - if: runner.os == 'Windows'
        run: target\release\emucat-agent.exe --version
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: emucat-agent-windows-x64
          path: agent/target/release/emucat-agent.exe
          if-no-files-found: error
