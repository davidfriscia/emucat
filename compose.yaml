name: emucat

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    # Settings are passed as flags rather than a mounted .cnf file: MariaDB ignores
    # world-writable config files, which is how Windows bind mounts appear in WSL2.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
      - --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?run pnpm env:init or set it in .env}
      MARIADB_DATABASE: ${DB_NAME:-emucat}
      MARIADB_USER: ${DB_USER:-emucat}
      MARIADB_PASSWORD: ${DB_PASSWORD:?run pnpm env:init or set it in .env}
    ports:
      # Local development only: never published beyond the loopback interface.
      - 127.0.0.1:${DB_PORT:-3307}:3306
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mariadb-data:
