<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Self-hosted catalog and launcher for 86Box and QEMU virtual machines."
    />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/favicon.svg" />
    <title>EmuCat</title>
    <script>
      // Applied before the first paint so a dark theme never flashes light.
      (function () {
        var theme = 'auto';
        try {
          theme = localStorage.getItem('emucat.theme') || 'auto';
        } catch (error) {
          // Storage can be unavailable; fall back to the system preference.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
