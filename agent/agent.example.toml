# Example EmuCat agent configuration. Copy to the location shown by `emucat-agent info`
# or pass it with `--config`, then replace the placeholder paths.
#
# Environment variables override this file:
#   EMUCAT_AGENT_CONFIG                path to this file
#   EMUCAT_AGENT_API_URL               [server] api_url
#   EMUCAT_AGENT_NAME                  [agent] name
#   EMUCAT_AGENT_86BOX_BASE_PATH       [emulators.86box] base_path
#   EMUCAT_AGENT_86BOX_EXECUTABLE      [emulators.86box] executable
#   EMUCAT_AGENT_QEMU_BASE_PATH        [emulators.qemu] base_path
#   EMUCAT_AGENT_QEMU_EXECUTABLE       [emulators.qemu] executable
#   EMUCAT_AGENT_STATE_DIR             [state] dir
#   EMUCAT_AGENT_STAGING_DIR           [storage] staging_dir
#   EMUCAT_AGENT_LOG_LEVEL             [logging] level
#   EMUCAT_AGENT_LOG_FORMAT            [logging] format
#
# This file holds no secrets, and cannot: unknown settings are errors. The credential comes from
# `emucat-agent pair`, and is stored encrypted in the state directory. See docs/agent.md.

[server]
# The agent only ever makes outbound connections to this URL. Use https. Plain http is accepted only
# for a server on this computer.
api_url = "http://127.0.0.1:4000"

[agent]
# The name an administrator sees when approving this agent. Defaults to the computer's name.
# name = "Study PC"

# Each VM lives in BASE_PATH/VM_NAME. Configure at least one emulator, with both values. The base path
# is the folder that holds the VM folders, which is usually not where the emulator is installed.
# Use single quotes for Windows paths so that backslashes are taken literally.
[emulators.86box]
base_path = 'C:\path\to\86box-vms'
executable = 'C:\path\to\86Box.exe'

[emulators.qemu]
base_path = 'C:\path\to\qemu-vms'
executable = 'C:\Program Files\qemu\qemu-system-x86_64.exe'

[state]
# Where the agent keeps its own data, including its encrypted credential. Defaults to a per-user location; see `emucat-agent info`.
# Must not be inside an emulator base path.
# dir = 'C:\path\to\emucat-agent-state'

[storage]
# Where archives are built while a VM is being registered. It needs room for the whole VM, and must be
# outside every VM directory. Defaults to `staging` in the state directory.
# staging_dir = 'D:\EmuCat\staging'

# How to reach an SSH repository. The section name is the repository's UUID, from the Repositories page.
# Only a repository named here can be used, whatever the server asks for. See docs/repositories.md.
#
# This file names where the private key is, and never holds it. A passphrase, if the key has one, is
# stored separately with `emucat-agent repository-passphrase`, protected with DPAPI.
#
# [repositories."018f47a0-7c2b-4f7e-9a3d-1b2c3d4e5f61"]
# kind = "sftp"
# host = "nas.example.lan"
# port = 22
# username = "emucat"
# remote_root = "/emucat"
# private_key_path = 'C:\Users\me\.ssh\emucat_ed25519'
# # Either or both. Host keys are always verified, and an unknown or changed key fails.
# host_key_fingerprints = ["SHA256:replace-with-the-output-of-ssh-keygen-lf"]
# # known_hosts_path = 'C:\Users\me\.ssh\known_hosts'
# connect_timeout_seconds = 20
# transfer_timeout_seconds = 60
# connect_retries = 2
# upload_attempts = 2

[logging]
# An EnvFilter expression: error, warn, info, debug, trace, or per-module directives.
level = "info"
# text or json
format = "text"
