[package]
name = "emucat-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Headless local agent for EmuCat."
publish = false

[lib]
name = "emucat_agent"
path = "src/lib.rs"

[[bin]]
name = "emucat-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54", features = ["macros", "rt", "signal"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.29", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = "symbols"
