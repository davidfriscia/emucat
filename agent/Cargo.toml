[package]
name = "emucat-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Headless local agent for EmuCat."
publish = false

[lib]
name = "emucat_agent"
path = "src/lib.rs"

[[bin]]
name = "emucat-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fastrand = "2.5"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
notify = "8.2"
# The operating system's TLS and trust store: SChannel on Windows. See decision 0009.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.29", features = ["serde", "v4"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2", "time"] }

# Hashing and compressing are what a VM's gigabytes spend their time in, and the tests build real
# archives, so these stay fast in debug builds too.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = "thin"
strip = "symbols"

# Only the fake emulator of the lifecycle tests opens a window. The release build does not need these.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
